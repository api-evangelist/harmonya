aid: harmonya
name: Harmonya
description: >-
  Harmonya is a New York- and Tel Aviv-based product intelligence company for consumer packaged
  goods manufacturers and retailers. Founded in 2021, it reads live product listings, pack and
  label copy, manufacturer specs, syndicated feeds and consumer reviews, and turns them into
  normalized product attributes at the UPC level — claims, ingredients, flavors, pack, dietary
  positioning and measured nutrition values — plus demand themes and consumer-voice signals
  layered on top. The platform ships as four modules (Demand Intelligence, Consumer Intelligence,
  Attribute Intelligence and Product Catalog) delivered through a tenant web application at
  app.harmonya.com and as an enriched product feed into a customer's PIM, data lake and analytics
  stack. Harmonya publishes no public developer portal, API reference or machine-readable
  contract; access runs through a sales conversation and an Auth0-protected tenant.
